appId: com.artfacility.fleshnote
productName: FleshNote
copyright: Copyright © 2026 Artfacility
publish:
  provider: github
  owner: ArtFacility
  repo: FleshNote
directories:
  buildResources: build
# Only what the app runs: the built main, preload and renderer, its icons, and package.json.
# electron-builder adds the runtime dependencies' node_modules itself; the renderer's libraries
# are bundled by Vite and listed as devDependencies, so they aren't copied a second time.
# A list of what to include (not what to leave out) keeps notes, docs, tools and the browser
# build (out/web, VPS_DEPLOY.md) out of the installer without anyone having to remember.
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
extraResources:
  - from: backend/dist/backend
    to: backend-dist
  - from: backend/Tutorial
    to: Tutorial
  - from: src/renderer/src/locales
    to: locales
# double-clicking a review file opens it in FleshNote
fileAssociations:
  - ext: flreview
    name: FleshNote Review
    description: FleshNote review file
    role: Editor
    # Linux packages (deb, snap, flatpak) register the type through this; an AppImage
    # registers nothing on its own
    mimeType: application/x-fleshnote-review
win:
  executableName: fleshnote-ide
  icon: build/icon.png
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  license: LICENSE
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - flatpak
  maintainer: Artfacility <artfacility.business@gmail.com>
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
flatpak:
  artifactName: ${name}-${version}.${ext}
  runtime: org.freedesktop.Platform
  runtimeVersion: "25.08"
  sdk: org.freedesktop.Sdk
  baseVersion: "25.08"
  finishArgs:
    - --share=network
    - --share=ipc
    - --socket=x11
    - --socket=wayland
    - --device=dri
    - --filesystem=home
    - --talk-name=org.freedesktop.Notifications
npmRebuild: false
